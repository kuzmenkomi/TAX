[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app"]
exclude = [
  "app/tests",
  "app/migrations",
]

[tool.ruff.lint]
# Undefined names / syntax only until broader unused-import cleanup lands.
select = ["E9", "F63", "F7", "F82"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["E501", "F811", "F401"]
"app/migrations/*" = ["ALL"]

[tool.bandit]
exclude_dirs = ["app/tests", "app/migrations"]
