services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taxuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}           # REQUIRED — no default
      POSTGRES_DB: ${POSTGRES_DB:-tax_app_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"                                          # internal only — never exposed to host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxuser} -d ${POSTGRES_DB:-tax_app_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tax-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Redis (rate-limiting / caching) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tax-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your environment}
    expose:
      - "6379"
    networks:
      - tax-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── FastAPI Backend (Gunicorn) ────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tax-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    expose:
      - "8000"                                          # internal only — Nginx proxies
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-taxuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tax_app_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}                 # REQUIRED
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}                 # REQUIRED
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
      STRIPE_PRICE_ID_PRO: ${STRIPE_PRICE_ID_PRO:-}
      STRIPE_PRICE_ID_BUSINESS: ${STRIPE_PRICE_ID_BUSINESS:-}
      ENABLE_METRICS: "true"
    volumes:
      - ./data/runs:/app/data/runs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - tax-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── React Frontend (Nginx + SSL) ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tax-frontend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro              # mount your Let's Encrypt certs here
      - certbot_webroot:/var/www/certbot:ro        # for ACME challenges
    depends_on:
      backend:
        condition: service_healthy
      ssl-init:
        condition: service_completed_successfully
    networks:
      - tax-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Certbot (one-shot SSL renewal) ───────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: tax-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >
      /bin/sh -c "
        certbot certonly --webroot -w /var/www/certbot
        --email ${ADMIN_EMAIL:-admin@example.com}
        --agree-tos --no-eff-email
        -d ${DOMAIN:-localhost}
        && echo 'Certificate obtained successfully'
      "
    profiles:
      - ssl

  # ─── SSL Initializer ──────────────────────────────────────────────────────
  ssl-init:
    image: alpine/openssl
    container_name: tax-ssl-init
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
      - ./scripts/init-ssl.sh:/init-ssl.sh:ro
    entrypoint: ["/bin/sh", "/init-ssl.sh"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}

  # ─── Background Worker (Arq) ──────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tax-worker
    command: ["arq", "app.worker.WorkerSettings"]
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-taxuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tax_app_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0}
    volumes:
      - ./data/runs:/app/data/runs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      disable: true
    networks:
      - tax-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: tax-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    expose:
      - "9090"
    networks:
      - tax-network

  # ─── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: tax-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in your environment}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    depends_on:
      - prometheus
    networks:
      - tax-network

  # ─── Database Backup (daily cron) ───────────────────────────────────────
  db-backup:
    image: postgres:16-alpine
    container_name: tax-db-backup
    volumes:
      - ./scripts/backup-db.sh:/backup-db.sh:ro
      - ./backups:/backups
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taxuser}
      POSTGRES_DB: ${POSTGRES_DB:-tax_app_db}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    entrypoint: >
      /bin/sh -c "
        echo '0 3 * * * /bin/sh /backup-db.sh >> /var/log/backup.log 2>&1' | crontab -
        && echo 'Backup cron installed (daily at 03:00 UTC)'
        && crond -f -l 2
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tax-network
    restart: unless-stopped
    profiles:
      - backup

volumes:
  postgres_data:
  certbot_webroot:
  prometheus_data:
  grafana_data:

networks:
  tax-network:
    driver: bridge
