name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest-cov pip-audit
      - name: pip-audit (non-blocking)
        run: pip-audit -r backend/requirements.txt
        continue-on-error: true
      - run: |
          cd backend
          pytest --cov=app --cov-config=.coveragerc --cov-report=term-missing:skip-covered --cov-report=html:../output/coverage --cov-fail-under=65 -q
        env:
          DATABASE_URL: sqlite:///./test.db
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          ENCRYPTION_KEY: 4u_YAgw-wP1-rlvJg1nQkl4xBqOG4v8Q5YO3m_KvVhs=
          APP_ENV: development

  backend-migrate-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tax
          POSTGRES_PASSWORD: tax
          POSTGRES_DB: taxdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tax -d taxdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Alembic upgrade head
        run: cd backend && alembic upgrade head
        env:
          DATABASE_URL: postgresql://tax:tax@localhost:5432/taxdb

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm test -- --run
      - run: cd frontend && npm run build
