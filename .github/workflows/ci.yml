name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - run: pip install -r backend/requirements-test.txt pip-audit
      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt
      - run: |
          cd backend
          pytest --cov=app --cov-config=.coveragerc --cov-report=term-missing:skip-covered --cov-report=html:../output/coverage --cov-fail-under=65 -q
        env:
          DATABASE_URL: sqlite:///./test.db
          JWT_SECRET_KEY: ""
          ENCRYPTION_KEY: ""
          APP_ENV: development

  backend-migrate-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tax
          POSTGRES_PASSWORD: tax
          POSTGRES_DB: taxdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tax -d taxdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Alembic upgrade head
        run: cd backend && alembic upgrade head
        env:
          DATABASE_URL: postgresql://tax:tax@localhost:5432/taxdb

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm test -- --run
      - run: cd frontend && npm run build
